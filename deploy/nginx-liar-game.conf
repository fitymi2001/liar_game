# /etc/nginx/sites-available/liar-game
# liar.example.com 을 내 도메인으로 바꾸세요. HTTPS(443) 블록은 certbot --nginx 가 자동으로 추가합니다.

# WebSocket 업그레이드 요청일 때만 Connection: upgrade 를 넘깁니다.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name liar.example.com;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 서버가 15초마다 ping 을 보내므로 넉넉하게
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
